name: Build iOS Rootless DEB (jailbreak)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 1.0.28+1404, default: from app Info.plist)"
        required: false

jobs:
  build-deb:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'

      - name: Install ldid
        run: brew install ldid

      - name: Build rootless deb
        run: |
          chmod +x iOS/clashmi/scripts/build_rootless_deb.sh \
                  iOS/clashmi/scripts/package_rootless_deb.sh
          if [ -n "${{ github.event.inputs.version }}" ]; then
            iOS/clashmi/scripts/build_rootless_deb.sh \
              -v "${{ github.event.inputs.version }}" \
              -o "dist/clashmi-rootless-arm64.deb"
          else
            iOS/clashmi/scripts/build_rootless_deb.sh \
              -o "dist/clashmi-rootless-arm64.deb"
          fi
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashmi-rootless-arm64-deb
          path: dist/clashmi-rootless-arm64.deb
