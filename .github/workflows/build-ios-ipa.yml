name: Build iOS IPA (jailbreak)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'

      - name: Build Libclash.xcframework
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          export GOPROXY=https://goproxy.cn,direct
          gomobile init
          gomobile bind \
            -target=ios \
            -o iOS/clashmi/bind/apple/Libclash.xcframework \
            github.com/metacubex/mihomo/iOS/libclash

      - name: Flutter pub get
        working-directory: iOS/clashmi
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: iOS/clashmi/ios
        run: pod install

      - name: Build iOS app (no codesign)
        working-directory: iOS/clashmi/ios
        run: |
          set +e
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build > /tmp/xcb.log 2>&1
          XCB=$?
          echo "=== ERROR DIAGNOSTICS ==="
          grep -B5 -A25 "does not conform\|error:\|BUILD FAILED" /tmp/xcb.log | head -300
          echo "=== BUILD OUTPUT ==="
          find build/Release-iphoneos -maxdepth 1 -name "*.app" -print
          echo "=== END ==="
          exit $XCB

      - name: Install ldid
        run: brew install ldid

      - name: Sign with ldid and package ipa
        working-directory: iOS/clashmi
        run: |
          set -e
          APP=$(find ios/build/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP bundle: $APP"
          find "$APP" -type f -print0 | while read -d '' -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              echo "ldid sign: $f"
              ldid -S "$f"
            fi
          done
          ldid -S "$APP"
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp
          rm -f clashmi-ios.ipa
          zip -rqy clashmi-ios.ipa Payload
          ls -lh clashmi-ios.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashmi-ios-ipa
          path: /tmp/clashmi-ios.ipa
